name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # يفشل بس على ثغرات high/critical — moderate/low ما بتوقف الـCI (تجنبًا
      # لضجيج متكرر من ثغرات transitive بعيدة عن السيطرة المباشرة).
      - run: npm audit --audit-level=high
