name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # كاش eslint/prettier/tsc بين تشغيلات الـCI المتتالية (نفس الفرع) —
      # أول تشغيل بعد أي تغيير بالـcache key (قفل الحزم) بياخد وقته الطبيعي
      # كامل، وبعدها الفحوصات بتفحص بس الملفات المتغيّرة. راجع
      # docs/operations للتفاصيل (2026-09-19).
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-checks-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-checks-
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # يفشل بس على ثغرات high/critical — moderate/low ما بتوقف الـCI (تجنبًا
      # لضجيج متكرر من ثغرات transitive بعيدة عن السيطرة المباشرة).
      - run: npm audit --audit-level=high
